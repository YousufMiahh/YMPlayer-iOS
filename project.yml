name: YMPlayer
options:
  bundleIdPrefix: com.ymplayer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  YMPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: YM Player
        CFBundleName: YM Player
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: Developed by Yousuf Miah
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Downloads show in the Files app (On My iPhone → YM Player)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Watching on a TV: finding Chromecasts and Google TVs on your network
        NSLocalNetworkUsageDescription: YM Player looks for Chromecasts and Google TVs on your network and sends them what you're watching.
        NSBonjourServices:
          - _googlecast._tcp
        # Plain http:// providers
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ymplayer.ios
        PRODUCT_NAME: YMPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
